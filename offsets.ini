# Globals below are the 2.59.0.98 numbers from UnknownCheats post 4852008
# (beida, 2026-11-05). That post then said the view matrix had been found and
# did not publish the replacement. They were NOT checked against a local aces.exe
# in this tree. verified=0 is the honest state. Do not flip it without a dump.
#
# Field offsets (unit_list*, position, team, state, owned_unit) were already in
# this file. They were not re-derived from a current client. A June 2026 post
# used a different cgame generation and the same owned-unit idea (0x8E8) and
# unit list 3 at 0x340/0x350, which is why three lists are read.
#
# listed 0 in the hangar is normal. listed 0 for more than a few seconds inside
# a match means these moved. A list whose count is above max_units is truncated
# to max_units, not dropped.
#
# viewmatrix_is_pointer=1 if the global is a pointer instead of an inline matrix.
# w2s=0 is column-major (m[0], m[4], m[8], m[12]). w2s=1 flips the multiply.
# world_up: 0=X, 1=Y, 2=Z. 1 is the default and is unverified.
# window_class=DagorWClass is the historical Dagor class. It was not confirmed here.
# The host falls back to a visible window whose title contains window_title.

verified=0
cgame=0x7A4B848
localplayer=0x7A22CB0
viewmatrix=0x7AA58B8
viewmatrix_is_pointer=0
unit_list=0x310
unit_count=0x320
unit_list2=0x328
unit_count2=0x338
unit_list3=0x340
unit_count3=0x350
position=0xD40
team=0x1018
state=0xF98
owned_unit=0x8E8
state_max_alive=2
w2s=0
world_up=1
max_units=128
esp=1
radar=1
radar_range=1500
window_class=DagorWClass
window_title=War Thunder
